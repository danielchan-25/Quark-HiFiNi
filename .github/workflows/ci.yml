name: Ubuntu and MySQL checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: quark_hifini_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      HIFINI_MYSQL_INTEGRATION: '1'
      MYSQL_TEST_PASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate shell syntax
        run: find scripts -name '*.sh' -print0 | xargs -0 -r -n 1 bash -n
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Run regression and MySQL integration suite
        run: python -m unittest discover -v
      - name: Check safe scheduling preview
        run: python scripts/daily_workflow.py
